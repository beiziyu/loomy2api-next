# 复用已占用端口（示例：挂在已有 80 站点的 /loomy/ 路径下）
location = /loomy { return 301 /loomy/; }

location ^~ /loomy/v1/ {
    proxy_pass http://127.0.0.1:4556/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Prefix /loomy;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /loomy/healthz {
    proxy_pass http://127.0.0.1:4556/healthz;
}

location ^~ /loomy/ {
    proxy_pass http://127.0.0.1:4556/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Prefix /loomy;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}
